
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="styles.css"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js" defer></script>
    <script src="script.js" defer></script>
    <title>Document</title>
</head>
<body>
    <header class="topbar" role="banner">
  <div class="brand">
    <h1>Explore The World</h1>
    <p>Search and explore regions.</p>
  </div>
  
  <div class="controls">

    <span id="visitedCount" class="visited-count">Visited: 0</span>
    
    <input type="text" id="search" placeholder="Search country...">
    <select id="regionFilter">
      <option value="">All Regions</option>
      <option value="Africa">Africa</option>
      <option value="Asia">Asia</option>
      <option value="Europe">Europe</option>
      <option value="Americas">Americas</option>
      <option value="Oceania">Oceania</option>
    </select>

  <div class="game-dropdown">
  <button id="gameModeBtn" class="game-mode-btn" type="button">
    🎮 Game Mode ▾
  </button>

  <div id="gameMenu" class="game-menu" hidden>
    <button id="guessFlagOption" type="button">Guess the Flag</button>
    <button id="regionModeOption" type="button">Region Mode</button>
  </div>
  
</div>  

  </div>
</header>

<section id="gamePanel" class="game-panel" hidden>
  <div class="game-panel-header">
    <div>
      <p class="game-label">Map Challenge</p>
      <h2 id="gameTitle">Choose a Game Mode</h2>
    </div>

    <button id="exitGameBtn" class="exit-game-btn" type="button">
      Exit
    </button>
  </div>

  <div id="gameSetup" class="game-setup">
    <p>Select a game mode from the Game Mode dropdown.</p>
  </div>

  <div id="gameClue" class="game-clue"></div>

  <div class="game-stats">
    <span>Score: <strong id="score">0</strong></span>
    <span>Round: <strong id="round">0</strong></span>
    <span>Streak: <strong id="streak">0</strong></span>
    <span id="timerWrap" hidden>Time: <strong id="timer">60</strong></span>
  </div>

  <p id="gameMessage" class="game-message"></p>
  </section>

  <div id="map" role="region" aria-label="Interactive world map"></div>

  <div id="overlay" aria-hidden="true"></div>

   <aside id="countryPanel" role="dialog" aria-labelledby="countryName" aria-modal="true" hidden>
    <button id="closePanel" aria-label="Close country details" class="terminal-close">×</button>
    <div id="countryDetails">
     </div>
  </aside>
</body>
</html>
